<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.anychart.com/releases/8.11.1/js/anychart-core.min.js"></script>
  <script src="https://cdn.anychart.com/releases/8.11.1/js/anychart-pie.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="table">
    <section class="table_header">
      <h1>Cards data</h1>
      <div class="inputs">
        <div class="form">
          <label for="days"># of days:</label>
          <input name="days" class="form-control" type="text" id="days" pattern="[0-9]*" />
          <label for="months"># of months:</label>
          <input name="months" class="form-control" type="text" id="months" pattern="[0-9]*" max="3" />
          <input class="button" type="button" value="Submit">
        </div>
        <input type="search" placeholder="Search...">
        <img src="images/search.png">
      </div>
    </section>
    <section class="table_body">
      <table>
        <thead>
          <tr>
            <th>Card Number<span class="icon-arrow">&DownArrow;</span></th>
            <th>Date<span class="icon-arrow">&DownArrow;</span></th>
            <th>Amount<span class="icon-arrow">&DownArrow;</span></th>
            <th>Original Amount<span class="icon-arrow">&DownArrow;</span></th>
            <th>Description<span class="icon-arrow">&DownArrow;</span></th>
            <th>Payments<span class="icon-arrow">&DownArrow;</span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr>
            <td colspan="2">Sum</td>
            <td id="sum"></td>
          </tr>
        </tfoot>
      </table>
    </section>
  </main>
  <div id="chart">
    <div class="download">
      <a id="link" href="" disabled>Export to csv</a>
    </div>
    <div id="date-range">
      <label>Date Range:</label>
      <label id="range"></label>
    </div>
    <div id="date">
      <label for="from">From:</label>
      <input id="from" name="from" type="date">
      <label for="to">To:</label>
      <input id="to" name="to" type="date">
    </div>
    <div class="card-list">
      <div class="checkbox">
        <label for="select-all">Select all:</label>
        <input type="checkbox" name="select-all"></input>
      </div>
      <div class="list">
        <label for="cards">Select Cards:</label>
        <select id="cards" multiple></select>
      </div>
    </div>
    <div id="pie"></div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
